<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="../JK-Favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="dashboard">

        <div class="title-bar">
            <h1>Todo App</h1>
        </div>

        <div class="page-wrapper">

            <h2>Dashboard</h2>

            <div class="input-wrapper">
                <input type="text" name="input-list" class="input-list" placeholder="Enter a task...">

                <div class="input-btns">

                    <button onclick="addToList()" class="add-btn">Add</button>
                    <button onclick="clearList()" class="clear-btn">Clear</button>

                </div>
            </div>

            <div class="ui-wrapper">
                <ul class="ui-list">

                </ul>
            </div>

        </div>
    </main>

    <script src="todo.js"></script>
</body>

</html>
