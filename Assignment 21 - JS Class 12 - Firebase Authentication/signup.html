<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Register</title>
    <link rel="icon" type="image/x-icon" href="../JK-Favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <div class="title-bar">
            <h1>Todo App</h1>
        </div>

        <div class="page-wrapper">

            <h2>Register Now!</h2>

            <div class="login-wrapper">
                <div class="input-wrapper">
                    <input type="email" name="email" class="email" placeholder="Email Address">
                    <input type="password" name="password" class="password" placeholder="Password">
                </div>

                <div class="input-btns">
                    <button class="signup-btn">Register</button>
                </div>
                <div class="alt-link">
                    <p>Already a member? <a href="index.html">Login here</a></p>
                </div>
            </div>

        </div>

    </main>

    <script src="register.js" type="module" defer></script>
</body>

</html>
