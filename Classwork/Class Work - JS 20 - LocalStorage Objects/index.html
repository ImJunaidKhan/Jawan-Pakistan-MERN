<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage & Objects Class Work</title>

    <style>
        body {
            background-color: aliceblue;
        }

        .products-cards {
            display: flex;
            gap: 50px;
            justify-content: space-evenly;
            align-content: center;
            flex-wrap: wrap;
            min-height: 95vh;
        }

        .product-card {
            width: 300px;
            text-align: center;
            background-color: white;
            border-radius: 10px;
            box-shadow: 1px 1px 10px 1px black;
            padding: 10px 15px 30px 15px;
        }

        .product-card img {
            width: 300px;
        }

        .product-card button {
            background-color: orangered;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            border: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <main>
        <section class="products-wrapper">
            <div class="products-cards">
                
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
