<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Register</title>
    <link rel="icon" type="image/x-icon" href="../JK-Favicon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="dashboard">

        <div class="title-bar">
            <h1>Facebook App</h1>
        </div>

        <form id="signup-form" class="page-wrapper">

            <h2>Register Now!</h2>

            <div class="login-wrapper">
                <div class="input-wrapper">
                    <input type="text" name="name" id="name" placeholder="Full Name" required>
                    <input type="email" name="email" id="email" placeholder="Email Address" required>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                    <input type="tel" name="phone" id="phone" placeholder="Phone Number">
                    <input type="text" name="gender" id="gender" placeholder="Gender">
                    <input type="text" name="dob" id="dob" placeholder="Date of Birth (dd/mm/yyyy)">
                </div>

                <div class="input-btns">
                    <button class="signup-btn" type="submit">Register</button>
                </div>
                <div class="alt-link">
                    <p>Already a member? <a href="index.html">Login here</a></p>
                </div>
            </div>

        </form>

    </main>

    <script type="module" src="firebase-init.js"></script>
    <script src="register.js" type="module" defer></script>
</body>

</html>
