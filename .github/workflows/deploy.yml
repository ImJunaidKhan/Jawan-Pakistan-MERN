name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your main git branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate config.js for Assignment 21
        run: |
          cat << 'EOF' > "Assignment 21 - JS Class 12 - Firebase Authentication/config.js"
          ${{ secrets.FIREBASE_A21_CONFIG }}
          EOF

      - name: Generate config.js for Classwork 22
        run: |
          cat << 'EOF' > "Classwork/Class Work 22 - JS Firebase Auth and DB/config.js"
          ${{ secrets.FIREBASE_CW22_CONFIG }}
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
