<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 20 - JS Class 11 - Quiz App</title>
    <link rel="icon" type="image/x-icon" href="../JK-Favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1 class="animate__animated animate__fadeInDown">Quiz App</h1>
        <section id="quiz-wrapper" class="animate__animated animate__fadeInUp animate__delay-1s">
            <div id="quiz-intro">
                <h2>Ready for the Challenge?</h2>
                <p class="message start-message">Prove your smarts, track your progress, and aim for a 100% score. Jump
                    in and
                    test your speed and
                    accuracy.</p>
                <button onclick="startQuiz()">Begin Quiz</button>
            </div>

            <div id="quiz-questions">
            </div>

            <div id="quiz-ending">
                <h2>Quiz Completed!</h2>
                <p class="message score-display">You scored <span id="user-score">0</span> out of <span
                        id="total-score">10</span> (<span id="score-percentage">0%</span>)</p>
                <p class="message ending-message">Great effort! Practice makes perfect. Try again to hit a 100% score.
                </p>
                <button onclick="restartQuiz()">Try Again</button>
            </div>

        </section>

        <p id="credits" class="animate__animated animate__fadeIn animate__delay-2s">Powered by JK</p>
    </main>


    <script src="app.js"></script>
</body>

</html>
