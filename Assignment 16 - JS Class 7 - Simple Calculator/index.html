<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 16 - JS Class 7</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Assignment 16 - JS Class 7</h1>
        <h2>Simple Calculator by JK</h2>

        <section class="calculator-wrapper">
            <div class="screen-wrapper">
                <button class="button" onclick="calculate('C')">C</button>
                <input type="text" id="screen" disabled>
            </div>

            <div class="buttons-wrapper">
                <div class="container">
                    <div class="row">
                        <button class="button" onclick="calculate('7')">7</button>
                        <button class="button" onclick="calculate('8')">8</button>
                        <button class="button" onclick="calculate('9')">9</button>
                        <button class="button operator" onclick="calculate('/')">&divide;</button>
                    </div>
                    <div class="row">
                        <button class="button" onclick="calculate('4')">4</button>
                        <button class="button" onclick="calculate('5')">5</button>
                        <button class="button" onclick="calculate('6')">6</button>
                        <button class="button operator" onclick="calculate('*')">&times;</button>
                    </div>
                    <div class="row">
                        <button class="button" onclick="calculate('1')">1</button>
                        <button class="button" onclick="calculate('2')">2</button>
                        <button class="button" onclick="calculate('3')">3</button>
                        <button class="button operator" onclick="calculate('-')">-</button>
                    </div>
                    <div class="row">
                        <button class="button" onclick="calculate('0')">0</button>
                        <button class="button operator" onclick="calculate('.')">.</button>
                        <button class="button operator" onclick="calculate('=')">=</button>
                        <button class="button operator" onclick="calculate('+')">+</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
